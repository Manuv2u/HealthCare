# Host nginx site config for srihealthplus.com — lives at
# /etc/nginx/sites-available/srihealthplus.com on the VM, symlinked into
# sites-enabled/. Proxies to the frontend container (which itself proxies
# /api/ to the backend container internally — see frontend/nginx.conf).
#
# This starts HTTP-only so `certbot --nginx` can complete the ACME challenge
# and then rewrite this file in place to add the 443/TLS server block.
server {
    listen 80;
    listen [::]:80;
    server_name srihealthplus.com www.srihealthplus.com;

    location /.well-known/acme-challenge/ {
        root /data/certbot/www;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
}
